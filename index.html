<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="description" content="BSA Client Intelligence — strategic client leadership and portfolio readiness (Prototype)." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BSA Intelligence" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>BSA Client Intelligence</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('bsa-ci:prefs') || '{}');
        if (p.state && p.state.theme) document.documentElement.dataset.theme = p.state.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BSA Client Intelligence requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
