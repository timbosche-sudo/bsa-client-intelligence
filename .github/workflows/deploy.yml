name: Build and deploy to GitHub Pages

# Publishes the frontend with FICTIONAL demonstration data only.
# The confidentiality guard runs on source and on the built bundle; any finding fails the deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confidentiality check (source)
        run: node scripts/check-confidential.mjs src public
      - run: npm test
      - name: Build (includes confidentiality check of dist)
        run: npm run build
        env:
          VITE_APP_MODE: prototype
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
